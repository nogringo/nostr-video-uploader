name: nostr_video_uploader
description: "A cross platform video uploader for Nostr."
publish_to: 'none'
version: 0.3.1

environment:
  sdk: ^3.9.2

dependencies:
  bech32: ^0.2.2
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  get: ^4.7.3
  http: ^1.6.0
  image: ^4.7.2
  intl: any
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  mime: ^2.0.0
  ndk: ^0.7.1-dev.9
  ndk_flutter: ^0.0.1
  path: ^1.9.1
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  youtube_explode_dart: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
